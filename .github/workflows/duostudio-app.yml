name: DuoStudio app

on:
  # Repo is private, so macOS runner minutes burn the free quota at 10x — only
  # run push builds when the app, its core package or this workflow changes.
  push:
    branches: ["duo-studio", "main"]
    paths:
      - "DuoStudio/Sources/**"
      - "DuoStudio/Resources/**"
      - "DuoStudio/project.yml"
      - "DuoStudio/PoseCore/**"
      - ".github/workflows/duostudio-app.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, xcode-27]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Pick Duo compilation flags from SDK version
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iOS Simulator SDK: $SDK"
          # A command-line `SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited)'` re-inherits the
          # target-level DUO_* flags from project.yml, so the override must be a plain value.
          if [ "$(printf '%s\n' "27.1" "$SDK" | sort -V | head -1)" = "27.1" ]; then
            echo "DUO_OVERRIDE=" >> "$GITHUB_ENV"
          else
            echo "DUO_OVERRIDE=SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG" >> "$GITHUB_ENV"
            echo "::warning::iOS SDK $SDK < 27.1: Duo APIs (sceneAccessory, direction coordinator) are not compiled"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd DuoStudio && xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project DuoStudio/DuoStudio.xcodeproj \
            -scheme DuoStudio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            $DUO_OVERRIDE | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: build.log

  # Runtime smoke test: launch in a simulator and screenshot each skin/mode. Same paths filter as
  # the build job (private repo, macOS minutes are expensive) since it lives in the same workflow.
  smoke:
    name: Simulator smoke run
    needs: build
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          cd DuoStudio && xcodegen generate

      - name: Create and boot simulator
        run: |
          xcrun simctl list devicetypes
          xcrun simctl list runtimes
          RT=$(xcrun simctl list runtimes | grep "^iOS" | grep -vi unavailable | tail -1)
          RTID=$(echo "$RT" | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]*)$//')
          echo "Runtime: $RT -> $RTID"
          # Candidates: Duo first, then iPhones newest-first. The Duo type may be incompatible with
          # the installed runtime ("Incompatible device"), so take the first that creates.
          UDID=""
          for DEV in $( (xcrun simctl list devicetypes | grep -i "Duo"; xcrun simctl list devicetypes | grep "^iPhone" | grep -vi Duo | tail -r) | sed -E 's/.*\((com\.apple[^)]*)\).*//'); do
            if UDID=$(xcrun simctl create smoke "$DEV" "$RTID"); then
              echo "Device type used: $DEV"
              break
            fi
            UDID=""
            echo "Cannot create $DEV on $RTID, trying next"
          done
          [ -n "$UDID" ] || { echo "no usable device type"; exit 1; }
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if [ "$(printf '%s\n' "27.1" "$SDK" | sort -V | head -1)" = "27.1" ]; then
            DUO_OVERRIDE=""
          else
            DUO_OVERRIDE="SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG"
          fi
          xcodebuild build \
            -project DuoStudio/DuoStudio.xcodeproj \
            -scheme DuoStudio \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            $DUO_OVERRIDE | tail -50

      - name: Install, launch and screenshot
        run: |
          mkdir -p shots
          B=tech.kioh.duostudio
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/DuoStudio.app
          for s in camera microphone photos-add; do
            xcrun simctl privacy "$UDID" grant $s $B || true
          done

          # shot <name> <launch args...>: launch, wait, screenshot, crash check, terminate.
          shot() {
            name=$1; shift
            xcrun simctl launch "$UDID" $B "$@" || echo "launch failed: $name" >> shots/crashes.txt
            sleep "${WAIT:-10}"
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$B"; then
              echo "NOT RUNNING after launch: $name" >> shots/crashes.txt
            fi
            xcrun simctl io "$UDID" screenshot "shots/$name.png" || true
            xcrun simctl terminate "$UDID" $B || true
          }

          WAIT=6 shot 01-onboarding-studio -hasOnboarded NO -skin studio
          for skin in studio mono vintage modern pop; do
            for mode in pose dance; do
              shot "$skin-$mode" -hasOnboarded YES -skin $skin -studioMode $mode
            done
          done
          shot studio-interview -hasOnboarded YES -skin studio -studioMode interview
          shot studio-script -hasOnboarded YES -skin studio -studioMode script

          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "DuoStudio"' --style compact > shots/app-log.txt || true
          cp ~/Library/Logs/DiagnosticReports/DuoStudio*.ips shots/ 2>/dev/null || true
          ls shots/DuoStudio*.ips >/dev/null 2>&1 && echo "crash reports present (.ips)" >> shots/crashes.txt || true
          [ -f shots/crashes.txt ] && cat shots/crashes.txt || echo "no crashes detected"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: shots/
          if-no-files-found: warn

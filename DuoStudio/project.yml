# DuoStudio — native SwiftUI iPhone app (display name "Duo Studio").
#
# XcodeGen generates the .xcodeproj from this file — never hand-edit the generated project.
# `PoseCore` is a platform-neutral SwiftPM package (pure logic + its own tests, no
# UIKit/SwiftUI/Vision/CoreGraphics imports) so pose matching, hand-gesture classification, and
# studio state can be unit tested without a simulator.
#
# Requires Xcode 27.1 beta (iOS 27.1 SDK): the app sources reference `.sceneAccessory` /
# `CameraCaptureAccessory`, gated behind `if #available(iOS 27.1, *)` everywhere it's used, with a
# non-Duo fallback path.
#
# `DUO_DIRECTION_COORDINATOR` (Swift compiler flag) is OFF by default: AVKit's
# `AVCaptureDeviceDirectionCoordinator.h` is an empty stub in the Xcode 27.2 beta 2 SDK (CI,
# 2026-10-18), so the symbol does not exist yet. Add it to
# `SWIFT_ACTIVE_COMPILATION_CONDITIONS` below once an SDK ships the class. When on, it — it guards the real
# `AVCaptureDeviceDirectionCoordinator` integration in `Sources/Views/CameraDirectionAnchor.swift`,
# still nested inside `if #available(iOS 27.1, *)`, so non-Duo/pre-27.1 devices always fall back to
# the classic wide-angle front/back cameras.
#
# Building with Xcode 26 (iOS 26 SDK) instead of 27.1: drop both `DUO_DIRECTION_COORDINATOR` and
# `DUO_SCENE_ACCESSORY` (guarding `AVCaptureDeviceDirectionCoordinator` and `sceneAccessory`/
# `CameraCaptureAccessory`) — no source edits needed, e.g.
# `xcodebuild ... SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG` (not `'$(inherited)'`: on the command
# line that re-inherits this target's DUO_* flags). Those 27.x symbols don't exist in the Xcode 26 SDK,
# so `#available` alone can't hide them.
#
# UNVERIFIED (2026-09-20): written on Windows with no Xcode/xcodegen toolchain to verify against —
# confirm on a Mac that `xcodegen generate` produces a working project and that it builds & runs.
name: DuoStudio
options:
  bundleIdPrefix: tech.kioh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  PoseCore:
    path: PoseCore
targets:
  DuoStudio:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Assets.xcassets
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.duostudio
        PRODUCT_NAME: DuoStudio
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DUO_SCENE_ACCESSORY"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # Simulator-only sample clip (see plan.md "Simulator"): never ship it to devices.
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]": SimulatorSample.mp4
    dependencies:
      - package: PoseCore
        product: PoseCore
schemes:
  DuoStudio:
    build:
      targets:
        DuoStudio: all
    run:
      config: Debug

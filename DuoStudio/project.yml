# DuoStudio — native SwiftUI iPhone app (display name "Duo Studio").
#
# XcodeGen generates the .xcodeproj from this file — never hand-edit the generated project.
# `PoseCore` is a platform-neutral SwiftPM package (pure logic + its own tests, no
# UIKit/SwiftUI/Vision/CoreGraphics imports) so pose matching, hand-gesture classification, and
# studio state can be unit tested without a simulator.
#
# Requires Xcode 27.1 beta (iOS 27.1 SDK): the app sources reference `.sceneAccessory` /
# `CameraCaptureAccessory`, gated behind `if #available(iOS 27.1, *)` everywhere it's used, with a
# non-Duo fallback path.
#
# `DUO_DIRECTION_COORDINATOR` (Swift compiler flag) is ON by default via
# `SWIFT_ACTIVE_COMPILATION_CONDITIONS` below — it guards the real
# `AVCaptureDeviceDirectionCoordinator` integration in `Sources/Views/CameraDirectionAnchor.swift`,
# still nested inside `if #available(iOS 27.1, *)`, so non-Duo/pre-27.1 devices always fall back to
# the classic wide-angle front/back cameras.
#
# Building with Xcode 26 (iOS 26 SDK) instead of 27.1: remove `DUO_DIRECTION_COORDINATOR` from
# `SWIFT_ACTIVE_COMPILATION_CONDITIONS` below AND the `sceneAccessory`/`CameraCaptureAccessory`
# usage in `Sources/Views/OuterDisplayAccessory.swift` — both are 27.x-only APIs and Xcode 26 can't
# even parse them behind `#if`/`#available` alone (the symbols themselves don't exist in that SDK).
#
# UNVERIFIED (2026-09-20): written on Windows with no Xcode/xcodegen toolchain to verify against —
# confirm on a Mac that `xcodegen generate` produces a working project and that it builds & runs.
name: DuoStudio
options:
  bundleIdPrefix: tech.kioh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  PoseCore:
    path: PoseCore
targets:
  DuoStudio:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Assets.xcassets
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.duostudio
        PRODUCT_NAME: DuoStudio
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DUO_DIRECTION_COORDINATOR"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # Simulator-only sample clip (see plan.md "Simulator"): never ship it to devices.
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]": SimulatorSample.mp4
    dependencies:
      - package: PoseCore
        product: PoseCore
schemes:
  DuoStudio:
    build:
      targets:
        DuoStudio: all
    run:
      config: Debug

# FaceToFaceCaption — native SwiftUI iPhone app (display name "Across").
#
# XcodeGen generates the .xcodeproj from this file — never hand-edit the generated project.
# `CaptionCore` is a platform-neutral SwiftPM package (pure logic + its own tests, no
# UIKit/SwiftUI/Speech imports) so the conversation/translation state machine can be unit tested
# without a simulator.
#
# UNVERIFIED (2026-09-13): written on Windows with no Xcode/xcodegen toolchain to verify against —
# confirm on a Mac that `xcodegen generate` produces a working project and that it builds & runs.
name: FaceToFaceCaption
options:
  bundleIdPrefix: tech.kioh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  CaptionCore:
    path: CaptionCore
targets:
  FaceToFaceCaption:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Assets.xcassets
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: tech.kioh.across
        PRODUCT_NAME: FaceToFaceCaption
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: CaptionCore
        product: CaptionCore
schemes:
  FaceToFaceCaption:
    build:
      targets:
        FaceToFaceCaption: all
    run:
      config: Debug
